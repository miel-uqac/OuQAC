<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Fond : vert principal du panel communauté (variable CSS primary-color ; un commentaire XML ne peut pas contenir deux tirets) -->
    <rect width="512" height="512" rx="96" fill="#6b8915"/>
    <!-- Épingle de carte : tête ronde (rayon 112) prolongée par une pointe -->
    <g transform="translate(0 16)">
        <path d="M256 424 C214 360 144 290 144 216 A112 112 0 1 1 368 216 C368 290 298 360 256 424 Z" fill="#ffffff"/>
        <!-- Trou de l'épingle, de la couleur du fond -->
        <circle cx="256" cy="216" r="44" fill="#6b8915"/>
    </g>
</svg>
